[workspace]
resolver = "3"
members = [
    "crates/ledger-core",
    "crates/ledger-script",
    "crates/ledger-store",
    "crates/ledger-api",
    "crates/ledger-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "BUSL-1.1"
repository = "https://github.com/Next-Vector/stablecoin-ledger"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
thiserror = "2.0.21"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
http-body-util = "0.1.5"
getrandom = "0.4.3"
sha2 = "0.11.1"
aes-gcm = "0.11.1"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
subtle = "2.6.1"
hex = "0.4.3"
proptest = "1.12.0"
