[advisories]
# RUSTSEC-2026-0459 (libsqlite3-sys, C SQLite CVE): sqlx-sqlite is recorded in Cargo.lock as an
# optional dependency of sqlx, but it is never compiled — only the postgres driver is enabled.
# sqlx-sqlite 0.9.0 pins libsqlite3-sys < 0.38, so it cannot be bumped to the patched 0.39+.
# CI step "Ignored advisories are unreachable" fails if libsqlite3-sys ever enters the build graph.
# Remove this entry once sqlx ships a release with the patched libsqlite3-sys.
ignore = ["RUSTSEC-2026-0459"]
