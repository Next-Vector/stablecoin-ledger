services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ledger]

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.9.0
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "${ANVIL_CHAIN_ID}"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.stablecoin-ledger-anvil.rule=Host(`anvil.stablecoin-ledger.localhost`)
      - traefik.http.routers.stablecoin-ledger-anvil.entrypoints=web
      - traefik.http.services.stablecoin-ledger-anvil.loadbalancer.server.port=8545
    networks: [ledger, proxy]

  ledger-api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    # Migrate first, then serve; both share the compiled target/ volume.
    command: ["sh", "-c", "cargo run --locked -q -p ledger-api -- migrate && exec cargo run --locked -q -p ledger-api -- serve"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BIND_ADDR: 0.0.0.0:8080
      LOG_FORMAT: json
    volumes:
      - ../crates:/app/crates
      - ../Cargo.toml:/app/Cargo.toml
      - ../Cargo.lock:/app/Cargo.lock
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.stablecoin-ledger-api.rule=Host(`api.stablecoin-ledger.localhost`)
      - traefik.http.routers.stablecoin-ledger-api.entrypoints=web
      - traefik.http.services.stablecoin-ledger-api.loadbalancer.server.port=8080
    networks: [ledger, proxy]

volumes:
  postgres-data:
  cargo-target:
  cargo-registry:

networks:
  ledger:
  proxy:
    external: true
