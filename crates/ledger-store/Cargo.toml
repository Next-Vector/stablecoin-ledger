[package]
name = "ledger-store"
description = "PostgreSQL storage for the ledger journal and materialized balances."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Integration tests need the run-integration PostgreSQL (see scripts/test-integration.sh).
integration = []

[dependencies]
ledger-core = { path = "../ledger-core" }
sqlx.workspace = true

[dev-dependencies]
tokio.workspace = true

[[test]]
name = "migrations"
required-features = ["integration"]

[[test]]
name = "pg_store"
required-features = ["integration"]

[[test]]
name = "concurrency"
required-features = ["integration"]

[[test]]
name = "rebuild"
required-features = ["integration"]
