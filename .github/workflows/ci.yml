name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.23.0
  CARGO_DENY_VERSION: 0.20.2

jobs:
  checks:
    # One ordered job: each step stops the pipeline on failure (fail-fast, cheapest first).
    # TODO: switch back to [self-hosted, light] once that runner picks up jobs for this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # Installs the version pinned in rust-toolchain.toml (persisted in ~/.rustup on the runner).
          rustup toolchain install
          rustc --version

      # Prebuilt binaries: hosted runners keep nothing between runs, so `cargo install` would rebuild every time.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Audit (advisories)
        run: cargo audit

      - name: Ignored advisories are unreachable
        run: |
          # .cargo/audit.toml ignores RUSTSEC-2026-0459 only because libsqlite3-sys is never compiled.
          if [ -n "$(cargo tree --workspace --all-features --target all -i libsqlite3-sys 2>/dev/null)" ]; then
            echo "libsqlite3-sys is now in the build graph: remove the ignore and fix RUSTSEC-2026-0459" >&2
            exit 1
          fi

      - name: Deny (licenses, bans, sources)
        run: cargo deny check licenses bans sources

      - name: Start integration stack
        run: ./run-integration up -d --wait

      - name: Integration tests
        run: ./scripts/test-integration.sh

      # Diagnostics must run before teardown, or there is nothing left to inspect.
      - name: Dump integration stack diagnostics
        if: failure()
        run: |
          ./run-integration ps -a
          for service in $(./run-integration config --services); do
            echo "::group::logs: $service"
            ./run-integration logs --no-color --timestamps --tail 200 "$service"
            echo "::endgroup::"
          done

      - name: Stop integration stack
        if: always()
        run: ./run-integration down -v --remove-orphans

      - name: Git hook tests
        run: ./scripts/test-hooks.sh

      - name: Dependabot config
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.23.0 pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" scripts/check-dependabot.py
