# Dependabot version updates. PRs target dev (feature → dev → main).
# Minor and patch bumps are grouped per ecosystem; majors arrive as separate PRs to schedule as real work.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /.docker
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
